<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kesinti Radar Mobil</title>
    <meta name="theme-color" content="#0B1120">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #0B1120;
            color: #F8FAFC;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .app-shell {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0B1120;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1E293B;
            width: 100%;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .header-badge {
            background: #EAB308;
            color: black;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            min-width: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .header-text h1 {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
        }

        .header-text p {
            font-size: 11px;
            color: #EAB308;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: #1E293B;
            border: 1px solid #334155;
            color: #EAB308;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 16px 6px 16px;
            width: 100%;
        }

        .stat-card {
            background: #1E293B;
            border-radius: 10px;
            padding: 8px 6px;
            border: 1px solid #334155;
            text-align: center;
            min-width: 0;
        }

        .stat-title {
            font-size: 9px;
            color: #94A3B8;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 800;
            margin-top: 2px;
            white-space: nowrap;
        }

        .filter-section {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 12px;
            width: 100%;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #FFF;
            width: 100%;
            font-size: 13px;
            margin-left: 8px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group-title {
            font-size: 10px;
            color: #64748B;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .pill {
            padding: 5px 11px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            background: #1E293B;
            color: #94A3B8;
            border: 1px solid #334155;
            cursor: pointer;
            user-select: none;
            transition: 0.15s ease;
        }

        .pill.active {
            background: #EAB308;
            color: #000;
            border-color: #EAB308;
            font-weight: 700;
        }

        .eq-list {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .eq-card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            min-width: 0;
            cursor: pointer;
        }

        .eq-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .eq-badge {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
        }

        .eq-badge .mag {
            font-size: 16px;
            line-height: 1;
        }

        .eq-badge .type {
            font-size: 8px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-top: 2px;
        }

        .eq-info {
            flex: 1;
            min-width: 0;
        }

        .eq-location {
            font-size: 14px;
            font-weight: 700;
            color: #F8FAFC;
            line-height: 1.3;
        }

        .eq-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 11px;
            color: #94A3B8;
            flex-wrap: wrap;
        }

        .eq-country-tag {
            background: #334155;
            color: #FBBF24;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .eq-details {
            display: none;
            padding-top: 8px;
            border-top: 1px dashed #334155;
            font-size: 12px;
            color: #CBD5E1;
            line-height: 1.5;
        }

        .eq-card.expanded .eq-details {
            display: block;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 56px;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid #1E293B;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #64748B;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #EAB308;
        }

        #map-view {
            display: none;
            position: fixed;
            top: 58px;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            z-index: 500;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container { background: #0B1120 !important; }

        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 16px 14px 20px 14px;
            width: 100%;
        }

        .page-btn {
            min-width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #1E293B;
            color: #94A3B8;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .page-btn.active {
            background: #EAB308;
            color: #000;
            border-color: #EAB308;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <header>
            <div class="header-title">
                <div class="header-badge">⚡</div>
                <div class="header-text">
                    <h1>KESİNTİ RADAR</h1>
                    <p id="clock-display">TR: --:-- | UTC: --:--</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-refresh" onclick="renderAll()">🔄 Yenile</button>
            </div>
        </header>

        <main id="list-view">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Toplam Kesinti</div>
                    <div class="stat-val" id="statTotal" style="color: #38BDF8;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Devam Eden</div>
                    <div class="stat-val" id="statOngoing" style="color: #F87171;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Planlı Bakım</div>
                    <div class="stat-val" id="statPlanned" style="color: #FBBF24;">0</div>
                </div>
            </div>

            <div class="filter-section">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="İl, ilçe veya servis sağlayıcı ara..." oninput="applyFilters()">
                </div>

                <div class="filter-group">
                    <div class="filter-wrap">
                        <div class="pill active" id="pill-tr" onclick="setScope('TR', this)">🇹🇷 Türkiye Şebekesi</div>
                        <div class="pill" id="pill-global" onclick="setScope('GLOBAL', this)">🌐 Uluslararası / ISP</div>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-group-title">Kategori Seçimi:</span>
                    <div class="filter-wrap">
                        <div class="pill active" onclick="setType('ALL', this)">Tümü</div>
                        <div class="pill" onclick="setType('ELECTRIC', this)">⚡ Elektrik</div>
                        <div class="pill" onclick="setType('WATER', this)">💧 Su</div>
                        <div class="pill" onclick="setType('GAS', this)">🔥 Gaz</div>
                        <div class="pill" onclick="setType('INTERNET', this)">🌐 İnternet</div>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-group-title">Tarih Aralığı:</span>
                    <div class="filter-wrap">
                        <div class="pill active" onclick="setTimeRange(1, this)">24 Saat</div>
                        <div class="pill" onclick="setTimeRange(3, this)">3 Gün</div>
                        <div class="pill" onclick="setTimeRange(7, this)">7 Gün</div>
                        <div class="pill" onclick="setTimeRange(15, this)">15 Gün</div>
                        <div class="pill" onclick="setTimeRange(30, this)">30 Gün</div>
                        <div class="pill" onclick="setTimeRange(90, this)">90 Gün</div>
                        <div class="pill" onclick="setTimeRange(365, this)">1 Sene</div>
                        <div class="pill" onclick="setTimeRange(1095, this)">3 Sene</div>
                        <div class="pill" onclick="setTimeRange(1825, this)">5 Sene</div>
                        <div class="pill" onclick="setTimeRange(3650, this)">10 Sene</div>
                    </div>
                </div>
            </div>

            <div class="eq-list" id="cardList"></div>
            <div class="pagination-container" id="pagination"></div>
        </main>

        <div id="map-view">
            <div id="map"></div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" id="nav-list" onclick="switchTab('list')">
                <span style="font-size: 18px;">📋</span>
                <span>Liste</span>
            </div>
            <div class="nav-item" id="nav-map" onclick="switchTab('map')">
                <span style="font-size: 18px;">🗺️</span>
                <span>Harita</span>
            </div>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function updateClock() {
            const now = new Date();
            const tr = now.toLocaleTimeString('tr-TR', { timeZone: 'Europe/Istanbul' });
            const utc = now.toLocaleTimeString('en-GB', { timeZone: 'UTC' });
            document.getElementById('clock-display').textContent = `TR: ${tr} | UTC: ${utc}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const outages = [
            { id: 1, scope: 'TR', type: 'ELECTRIC', provider: 'BEDAŞ', city: 'İstanbul / Beşiktaş Levent', lat: 41.0800, lon: 29.0100, title: 'Planlı Bakım ve Trafo Yenileme', status: 'planned', time: '09:00 - 15:30', affected: 4200, color: '#EAB308' },
            { id: 2, scope: 'TR', type: 'WATER', provider: 'İSKİ', city: 'İstanbul / Kadıköy Moda', lat: 40.9850, lon: 29.0300, title: 'Ana İsale Boru Patlağı', status: 'ongoing', time: '12:00 - 18:00', affected: 8500, color: '#0EA5E9' },
            { id: 3, scope: 'TR', type: 'GAS', provider: 'İGDAŞ', city: 'İstanbul / Üsküdar Çengelköy', lat: 41.0500, lon: 29.0550, title: 'Doğalgaz Hat Güçlendirme', status: 'planned', time: '13:00 - 17:00', affected: 1100, color: '#F97316' },
            { id: 4, scope: 'TR', type: 'INTERNET', provider: 'Türk Telekom', city: 'Ankara / Kızılay', lat: 39.9208, lon: 32.8541, title: 'Fiber Omurga Bakımı', status: 'ongoing', time: '02:00 - 06:00', affected: 12000, color: '#8B5CF6' },
            { id: 5, scope: 'TR', type: 'ELECTRIC', provider: 'Başkent EDAŞ', city: 'Ankara / Batıkent', lat: 39.9700, lon: 32.7400, title: 'Yeraltı Kablo Arızası', status: 'ongoing', time: 'Tahmini: 2 Saat', affected: 3200, color: '#EAB308' },
            { id: 6, scope: 'TR', type: 'WATER', provider: 'İZSU', city: 'İzmir / Alsancak', lat: 38.4350, lon: 27.1400, title: 'Pompa İstasyonu Arızası', status: 'resolved', time: 'Tamamlandı', affected: 5000, color: '#0EA5E9' },
            { id: 101, scope: 'GLOBAL', type: 'INTERNET', provider: 'Cloudflare', city: 'Avrupa & ABD Tier-1', lat: 50.1109, lon: 8.6821, title: 'BGP Yönlendirme Dalgalanması', status: 'ongoing', time: 'Son 45 Dk', affected: 250000, color: '#8B5CF6' },
            { id: 102, scope: 'GLOBAL', type: 'INTERNET', provider: 'AWS us-east-1', city: 'ABD / Kuzey Virginia', lat: 38.9500, lon: -77.4500, title: 'EC2 & S3 API Hata Oranı', status: 'ongoing', time: 'Devam Ediyor', affected: 500000, color: '#8B5CF6' },
            { id: 103, scope: 'GLOBAL', type: 'ELECTRIC', provider: 'National Grid', city: 'İngiltere / Londra', lat: 51.5050, lon: -0.0900, title: 'Trafo Merkezi Yangını Sonrası', status: 'ongoing', time: 'Tahmini: 3 Saat', affected: 45000, color: '#EAB308' }
        ];

        let currentScope = 'TR';
        let currentType = 'ALL';
        let searchQuery = '';
        let currentPage = 1;
        const pageSize = 5;

        let map = null;
        let markerLayer = null;

        function setScope(scope, el) {
            document.querySelectorAll('#pill-tr, #pill-global').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentScope = scope;
            currentPage = 1;
            renderAll();
        }

        function setType(type, el) {
            el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentType = type;
            currentPage = 1;
            renderAll();
        }

        function setTimeRange(days, el) {
            el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderAll();
        }

        function applyFilters() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            currentPage = 1;
            renderAll();
        }

        function getFiltered() {
            return outages.filter(o => {
                const matchScope = o.scope === currentScope;
                const matchType = currentType === 'ALL' || o.type === currentType;
                const matchSearch = searchQuery === '' || 
                    o.city.toLowerCase().includes(searchQuery) || 
                    o.provider.toLowerCase().includes(searchQuery);
                return matchScope && matchType && matchSearch;
            });
        }

        function renderAll() {
            const items = getFiltered();

            document.getElementById('statTotal').textContent = items.length;
            document.getElementById('statOngoing').textContent = items.filter(o => o.status === 'ongoing').length;
            document.getElementById('statPlanned').textContent = items.filter(o => o.status === 'planned').length;

            const totalPages = Math.ceil(items.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * pageSize;
            const pageItems = items.slice(start, start + pageSize);

            const container = document.getElementById('cardList');
            container.innerHTML = '';

            pageItems.forEach(o => {
                const card = document.createElement('div');
                card.className = 'eq-card';
                card.innerHTML = `
                    <div class="eq-card-header">
                        <div class="eq-badge" style="background: ${o.color};">
                            <span class="mag">${o.type === 'ELECTRIC' ? '⚡' : o.type === 'WATER' ? '💧' : o.type === 'GAS' ? '🔥' : '🌐'}</span>
                            <span class="type">${o.provider}</span>
                        </div>
                        <div class="eq-info">
                            <div class="eq-location">${o.city}</div>
                            <div class="eq-sub">
                                <span class="eq-country-tag">${o.status === 'ongoing' ? 'DEVAM EDİYOR' : o.status === 'planned' ? 'PLANLI' : 'ÇÖZÜLDÜ'}</span>
                                <span>~${o.affected.toLocaleString()} Abone</span>
                                <span>• ${o.time}</span>
                            </div>
                        </div>
                    </div>
                    <div class="eq-details">
                        <div>Arıza / Bakım: <strong>${o.title}</strong></div>
                        <div>Koordinat: <strong>${o.lat}, ${o.lon}</strong></div>
                    </div>
                `;
                card.onclick = () => card.classList.toggle('expanded');
                container.appendChild(card);
            });

            renderPagination(totalPages);
            updateMapMarkers(items);
        }

        function renderPagination(totalPages) {
            const pDiv = document.getElementById('pagination');
            pDiv.innerHTML = '';
            if (totalPages <= 1) return;

            const prev = document.createElement('div');
            prev.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prev.textContent = '◀';
            prev.onclick = () => { if (currentPage > 1) { currentPage--; renderAll(); } };
            pDiv.appendChild(prev);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; renderAll(); };
                pDiv.appendChild(btn);
            }

            const next = document.createElement('div');
            next.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
            next.textContent = '▶';
            next.onclick = () => { if (currentPage < totalPages) { currentPage++; renderAll(); } };
            pDiv.appendChild(next);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (tab === 'list') {
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('map-view').style.display = 'none';
            } else {
                document.getElementById('nav-map').classList.add('active');
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('map-view').style.display = 'block';
                initMap();
                setTimeout(() => map.invalidateSize(), 150);
            }
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { attributionControl: false }).setView([39.0, 35.0], 5);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
            markerLayer = L.layerGroup().addTo(map);
            updateMapMarkers(getFiltered());
        }

        function updateMapMarkers(items) {
            if (!markerLayer) return;
            markerLayer.clearLayers();
            items.forEach(o => {
                const c = L.circleMarker([o.lat, o.lon], {
                    radius: 8,
                    fillColor: o.color,
                    color: '#fff',
                    weight: 1.5,
                    fillOpacity: 0.9
                }).bindPopup(`<strong>${o.provider} - ${o.city}</strong><br>${o.title}`);
                markerLayer.addLayer(c);
            });
        }

        window.onload = () => renderAll();
    </script>
</body>
</html>
