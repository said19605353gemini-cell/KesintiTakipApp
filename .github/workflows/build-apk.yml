name: Build Android APK (High Performance)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build APK with Gradle (High Performance - 4 Cores / Parallel)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --parallel --build-cache --max-workers=4 -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KesintiTakipApp-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Public GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Kesinti Takip Sistemleri v1.0.${{ github.run_number }} (En Güncel Sürüm)"
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: false
        body: |
          ### 🚀 Kesinti Takip Sistemleri - Mobil Android APK (Resmi Son Sürüm)
          
          ✨ **Özellikler & Güncellemeler:**
          - 📱 DepremAppMobile mobil standartlarında modern ve responsive tasarım
          - ⚡ 4 Çekirdekli yüksek performanslı Gradle mimarisi ile derlendi
          - 🗺️ ArcGIS World Dark Gray harita (403 veya API key hatası vermez)
          - 📅 Genişletilmiş zaman aralıkları: 24 Saat, 3-7-15-30-90 Gün, 1-3-5-10 Sene
          - 🔍 Akordiyon detay kartları ve dinamik veri filtreleme
          
          📦 **Doğrudan İndirme:** Aşağıdaki `app-debug.apk` dosyasını telefonunuza yükleyip hemen kullanabilirsiniz.
        files: android/app/build/outputs/apk/debug/app-debug.apk